[package]
name = "purgeon"
version = "0.1.0"
description = "Purgeon - a detailed Windows system monitor for CPU, RAM, VRAM and more"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
